<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <!-- Geometric border pattern reminiscent of Oracle certification template -->
    <pattern id="oracleBorder" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#c74634"/>
      <path d="M0 0 L20 20 L40 0 Z M0 40 L20 20 L40 40 Z" fill="#9e2a1b" opacity="0.7"/>
      <path d="M0 20 L20 0 L40 20 L20 40 Z" fill="#d97706" opacity="0.5"/>
      <circle cx="20" cy="20" r="4" fill="#1e1e24"/>
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Outer background with pattern -->
  <rect width="1200" height="850" fill="url(#oracleBorder)"/>

  <!-- Inner Certificate Parchment / Card -->
  <rect x="40" y="40" width="1120" height="770" rx="20" fill="#ffffff" filter="url(#cardShadow)"/>
  <rect x="52" y="52" width="1096" height="746" rx="14" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Header -->
  <!-- Oracle University Brand -->
  <g transform="translate(90, 95)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#c74634" letter-spacing="2">ORACLE</text>
    <text x="1" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#475569" letter-spacing="1">University</text>
  </g>

  <!-- Oracle Certified Professional Badge Seal -->
  <g transform="translate(1010, 140)">
    <!-- Ribbon tails -->
    <path d="M-20 40 L-25 100 L0 80 L25 100 L20 40 Z" fill="#c74634"/>
    <!-- Outer medal circle -->
    <circle cx="0" cy="0" r="58" fill="url(#silverGrad)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="46" fill="#f8fafc"/>
    <text text-anchor="middle" y="-12" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#c74634" letter-spacing="1">ORACLE</text>
    <text text-anchor="middle" y="2" font-family="system-ui, sans-serif" font-weight="600" font-size="8" fill="#64748b" letter-spacing="0.5">Certified</text>
    <rect x="-36" y="8" width="72" height="18" rx="3" fill="#1e293b"/>
    <text text-anchor="middle" y="21" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#ffffff" letter-spacing="0.5">Professional</text>
  </g>

  <!-- Main Certificate Headings -->
  <text x="90" y="210" font-family="Georgia, serif" font-weight="600" font-size="38" fill="#1e293b">Oracle Certified Professional</text>
  <text x="90" y="250" font-family="Georgia, serif" font-weight="400" font-size="24" fill="#64748b">Certificate of Recognition</text>

  <!-- Divider line -->
  <line x1="90" y1="280" x2="600" y2="280" stroke="#c74634" stroke-width="2"/>

  <!-- Recipient Name -->
  <text x="90" y="340" font-family="Georgia, serif" font-weight="700" font-size="32" fill="#0f172a">Anirban Bhowmik</text>

  <!-- Certification Name -->
  <text x="90" y="400" font-family="system-ui, sans-serif" font-weight="700" font-size="22" fill="#c74634">Oracle Cloud Infrastructure 2025 Certified Generative AI Professional</text>

  <!-- Body certification text -->
  <text x="90" y="460" font-family="system-ui, sans-serif" font-weight="400" font-size="16" fill="#475569">
    This certifies that the above named is recognized by Oracle Corporation as Oracle Certified.
  </text>

  <!-- Date and Signature Block -->
  <g transform="translate(90, 560)">
    <text font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#1e293b">October 28, 2025</text>
    <text y="22" font-family="system-ui, sans-serif" font-weight="400" font-size="14" fill="#64748b">Date</text>
  </g>

  <g transform="translate(560, 530)">
    <!-- Signature vector -->
    <path d="M 0 30 Q 30 5 60 25 T 120 15 Q 150 40 180 20 T 230 25" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 40 15 Q 50 35 30 40 Q 60 30 80 10" fill="none" stroke="#0f172a" stroke-width="1.8"/>
    <line x1="0" y1="48" x2="240" y2="48" stroke="#cbd5e1" stroke-width="1"/>
    <text y="68" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#1e293b">Gary N Miller</text>
    <text y="88" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#64748b">Customer Success Officer, EVP CSS</text>
  </g>

  <!-- Validity and Security Verification -->
  <g transform="translate(90, 680)">
    <text font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#334155">
      This eCertificate is valid until <tspan font-weight="700">October 28, 2027</tspan>
    </text>
  </g>

  <!-- Bottom Barcode & Credential ID -->
  <g transform="translate(860, 675)">
    <!-- Stylized barcode bars -->
    <g fill="#1e293b">
      <rect x="0" y="0" width="3" height="24"/>
      <rect x="5" y="0" width="2" height="24"/>
      <rect x="10" y="0" width="5" height="24"/>
      <rect x="18" y="0" width="2" height="24"/>
      <rect x="23" y="0" width="4" height="24"/>
      <rect x="30" y="0" width="2" height="24"/>
      <rect x="35" y="0" width="6" height="24"/>
      <rect x="44" y="0" width="2" height="24"/>
      <rect x="49" y="0" width="4" height="24"/>
      <rect x="56" y="0" width="3" height="24"/>
      <rect x="62" y="0" width="5" height="24"/>
      <rect x="70" y="0" width="2" height="24"/>
      <rect x="75" y="0" width="4" height="24"/>
      <rect x="82" y="0" width="2" height="24"/>
      <rect x="87" y="0" width="5" height="24"/>
      <rect x="95" y="0" width="3" height="24"/>
      <rect x="101" y="0" width="4" height="24"/>
      <rect x="108" y="0" width="2" height="24"/>
      <rect x="113" y="0" width="6" height="24"/>
      <rect x="122" y="0" width="3" height="24"/>
      <rect x="128" y="0" width="4" height="24"/>
      <rect x="135" y="0" width="2" height="24"/>
      <rect x="140" y="0" width="5" height="24"/>
      <rect x="148" y="0" width="3" height="24"/>
      <rect x="154" y="0" width="4" height="24"/>
      <rect x="161" y="0" width="2" height="24"/>
      <rect x="166" y="0" width="5" height="24"/>
      <rect x="174" y="0" width="3" height="24"/>
      <rect x="180" y="0" width="4" height="24"/>
      <rect x="187" y="0" width="3" height="24"/>
      <rect x="193" y="0" width="5" height="24"/>
      <rect x="201" y="0" width="3" height="24"/>
    </g>
    <text x="102" y="42" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="12" fill="#0f172a" letter-spacing="1">103008434OCI25GAIOCP</text>
  </g>
</svg>
