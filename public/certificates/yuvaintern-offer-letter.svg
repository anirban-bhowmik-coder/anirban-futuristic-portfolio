<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <filter id="pageShadow" x="-5%" y="-2%" width="110%" height="106%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="yuvaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
  </defs>

  <!-- Page Background Canvas -->
  <rect width="1200" height="1600" fill="#f1f3f6"/>
  <rect x="50" y="40" width="1100" height="1520" rx="6" fill="#ffffff" filter="url(#pageShadow)"/>

  <!-- Top Header Logos: YuvaIntern & NSDC -->
  <g transform="translate(140, 80)">
    <!-- YuvaIntern Brand Logo -->
    <g transform="translate(240, 0)">
      <text x="0" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="48" fill="#e65100" letter-spacing="-1">yuvā</text>
      <!-- Stylized Orange Dots / Accent arcs -->
      <circle cx="106" cy="18" r="4.5" fill="#e65100"/>
      <path d="M 88 12 Q 106 6 122 12" stroke="#e65100" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="76" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#333333" letter-spacing="4">intern</text>
    </g>

    <!-- Center Divider Line -->
    <line x1="420" y1="10" x2="420" y2="85" stroke="#e0e0e0" stroke-width="1.5"/>

    <!-- NSDC Brand Logo (National Skill Development Corporation) -->
    <g transform="translate(480, 0)">
      <!-- NSDC Multi-color Star Icon -->
      <g transform="translate(40, 0)">
        <circle cx="16" cy="10" r="4" fill="#00838f"/>
        <line x1="16" y1="10" x2="16" y2="28" stroke="#00838f" stroke-width="3"/>
        <circle cx="2" cy="18" r="4" fill="#e65100"/>
        <line x1="2" y1="18" x2="16" y2="28" stroke="#e65100" stroke-width="3"/>
        <circle cx="30" cy="18" r="4" fill="#1565c0"/>
        <line x1="30" y1="18" x2="16" y2="28" stroke="#1565c0" stroke-width="3"/>
        <circle cx="8" cy="34" r="3.5" fill="#ad1457"/>
        <circle cx="24" cy="34" r="3.5" fill="#2e7d32"/>
        <!-- Base arc -->
        <path d="M 4 38 Q 16 46 28 38" stroke="#1565c0" stroke-width="2.5" fill="none"/>
      </g>
      <text x="8" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#0f172a" letter-spacing="3">N·S·D·C</text>
      <text x="-4" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="9" fill="#555566" letter-spacing="1.5">RE·IMAGINE FUTURE</text>
    </g>
  </g>

  <!-- Document Title -->
  <text x="600" y="270" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" fill="#0f172a" letter-spacing="1">
    INTERNSHIP OFFER LETTER
  </text>
  <line x1="500" y1="290" x2="700" y2="290" stroke="#e65100" stroke-width="3" stroke-linecap="round"/>

  <!-- Date of Issue -->
  <text x="1050" y="340" text-anchor="end" font-family="Georgia, serif" font-size="16" fill="#1e293b">
    <tspan font-weight="bold">Date of Issue:</tspan> September 01, 2026
  </text>

  <!-- Salutation -->
  <text x="120" y="390" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#0f172a">
    Dear Anirban Bhowmik,
  </text>

  <!-- Formal Offer Body Paragraph -->
  <g font-family="Georgia, serif" font-size="16" fill="#1e293b" letter-spacing="0.2">
    <text x="120" y="435">
      We are pleased to extend to you this formal offer for an Internship position as
      <tspan font-weight="bold" fill="#0f172a">Junior Cyber Security Analyst - E-Governance</tspan>
    </text>
    <text x="120" y="465">
      <tspan font-weight="bold" fill="#0f172a">&amp; Digital Services</tspan> at <tspan font-weight="bold" fill="#e65100">YuvaIntern</tspan>. We were impressed with your background, skills and enthusiasm, and we believe you will be
    </text>
    <text x="120" y="495">
      a valuable addition to our team.
    </text>
  </g>

  <!-- Section: Internship Details -->
  <g transform="translate(120, 540)">
    <text x="0" y="0" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#0f172a">
      Internship Details
    </text>

    <g transform="translate(0, 25)" font-family="Georgia, serif" font-size="16" fill="#1e293b">
      <!-- Start Date -->
      <text x="0" y="20" font-weight="bold">Start Date</text>
      <text x="180" y="20">: September 01, 2026</text>

      <!-- End Date -->
      <text x="0" y="55" font-weight="bold">End Date</text>
      <text x="180" y="55">: September 29, 2026</text>

      <!-- Duration -->
      <text x="0" y="90" font-weight="bold">Duration</text>
      <text x="180" y="90">: 4 weeks</text>

      <!-- Location -->
      <text x="0" y="125" font-weight="bold">Location</text>
      <text x="180" y="125">: Remote</text>
    </g>
  </g>

  <!-- Section: Key Responsibilities -->
  <g transform="translate(120, 740)">
    <text x="0" y="0" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#0f172a">
      Key Responsibilities:
    </text>

    <g transform="translate(0, 25)" font-family="Georgia, serif" font-size="15.5" fill="#1e293b" letter-spacing="0.2">
      <text x="0" y="15">
        As a Junior Cyber Security Analyst - E-Governance &amp; Digital Services intern, you will work on tasks and projects related to
      </text>
      <text x="0" y="42">
        As a Junior Cyber Security Analyst in the E-Governance &amp; Digital Services sector, you will be responsible for ensuring the
      </text>
      <text x="0" y="69">
        security of digital platforms and services used in government operations. Your tasks may include conducting security
      </text>
      <text x="0" y="96">
        assessments, implementing security measures, and responding to cybersecurity incidents..
      </text>
    </g>
  </g>

  <!-- Section: Benefits & Learning Opportunities -->
  <g transform="translate(120, 895)">
    <text x="0" y="0" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#0f172a">
      Benefits &amp; Learning Opportunities:
    </text>

    <g transform="translate(0, 25)" font-family="Georgia, serif" font-size="15.5" fill="#1e293b">
      <text x="0" y="15">Throughout the duration of your internship, you will have the opportunity to:</text>
      
      <!-- Bullet 1 -->
      <circle cx="10" cy="42" r="3.5" fill="#0f172a"/>
      <text x="24" y="47">Develop practical skills in cybersecurity analysis, digital audit frameworks, and risk evaluation tools.</text>

      <!-- Bullet 2 -->
      <circle cx="10" cy="72" r="3.5" fill="#0f172a"/>
      <text x="24" y="77">Gain hands on experience in e-governance infrastructure hardening and security compliance projects.</text>
    </g>
  </g>

  <!-- Section: Non-Disclosure & Compliance -->
  <g transform="translate(120, 1030)" font-family="Georgia, serif" font-size="15.5" fill="#1e293b" letter-spacing="0.2">
    <text x="0" y="15">
      As part of joining our team, you may be required to sign a confidentiality or non-disclosure agreement. You are also expected to
    </text>
    <text x="0" y="42">
      comply with all applicable company policies and regulations, which will be provided to you upon commencement.
    </text>
  </g>

  <!-- Welcome closing -->
  <text x="120" y="1135" font-family="Georgia, serif" font-size="16" fill="#1e293b">
    We look forward to welcoming you to the team.
  </text>

  <!-- Signatory & Official Stamp Area -->
  <g transform="translate(120, 1180)">
    <!-- Signature Graphic -->
    <path d="M 10 32 Q 35 10 55 25 T 90 20 Q 110 35 125 15" stroke="#1a237e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 25 28 L 75 42" stroke="#1a237e" stroke-width="1.8" fill="none"/>
    <text x="14" y="32" font-family="'Brush Script MT', cursive, sans-serif" font-size="28" fill="#1a237e">Kounal</text>

    <!-- Official Stamp -->
    <g transform="translate(160, -20)">
      <circle cx="48" cy="48" r="44" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2"/>
      <circle cx="48" cy="48" r="40" fill="none" stroke="#2563eb" stroke-width="1.2"/>
      <!-- Top curved text -->
      <path id="stampTop" d="M 16 48 A 32 32 0 0 1 80 48" fill="none"/>
      <text font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#2563eb" letter-spacing="2">
        <textPath href="#stampTop" startOffset="50%" text-anchor="middle">YUVAINTERN</textPath>
      </text>
      <!-- Center Star & Certified -->
      <text x="48" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#2563eb" letter-spacing="1">★ ★ ★</text>
      <text x="48" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#2563eb" letter-spacing="1">CERTIFIED</text>
      <!-- Bottom curved text -->
      <path id="stampBottom" d="M 16 48 A 32 32 0 0 0 80 48" fill="none"/>
      <text font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#2563eb" letter-spacing="1.5">
        <textPath href="#stampBottom" startOffset="50%" text-anchor="middle">★ OFFICIAL ★</textPath>
      </text>
    </g>

    <!-- Signatory Name & Title -->
    <text x="0" y="85" font-family="Georgia, serif" font-weight="bold" font-size="18" fill="#0f172a">
      Kounal Gupta
    </text>
    <text x="0" y="110" font-family="Georgia, serif" font-size="15" fill="#e65100" font-weight="bold">
      Founder, YuvaIntern.com
    </text>
  </g>

  <!-- Bottom Corporate Offices Footer (Henry Harvin Global Network) -->
  <g transform="translate(100, 1430)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Office 1: America Head Office -->
    <g transform="translate(20, 20)">
      <rect x="0" y="2" width="10" height="10" fill="#cbd5e1"/>
      <text x="18" y="12" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#0f172a">Henry Harvin America Head Office</text>
      <text x="18" y="28" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Henry Harvin Inc.</text>
      <text x="18" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#475569">8 The Green, # 19614 Dover,</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="10" fill="#475569">DE 19901, United States.</text>
    </g>

    <!-- Office 2: Asia Pacific Office -->
    <g transform="translate(360, 20)">
      <rect x="0" y="2" width="10" height="10" fill="#cbd5e1"/>
      <text x="18" y="12" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#0f172a">Henry Harvin Asia Pacific Office</text>
      <text x="18" y="28" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Henry Harvin India Education LLP</text>
      <text x="18" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Henry Harvin House, B-12, Sector-6,</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Noida(UP), India - 201301</text>
    </g>

    <!-- Office 3: Middle East Office -->
    <g transform="translate(700, 20)">
      <rect x="0" y="2" width="10" height="10" fill="#cbd5e1"/>
      <text x="18" y="12" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" fill="#0f172a">Henry Harvin Middle East Office</text>
      <text x="18" y="28" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Henry Harvin Co. L.L.C.</text>
      <text x="18" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#475569">2703, Blue Matrix, 27th Floor,</text>
      <text x="18" y="56" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Prime Tower, Business Bay, Dubai, UAE</text>
    </g>
  </g>
</svg>
